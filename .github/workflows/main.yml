# Malayalam TV - ALL-IN-ONE build.
# This single file contains the complete Android app source and builds the APK.
# GitHub: Add file -> Create new file -> name: .github/workflows/build.yml -> paste -> Commit.
# Then Actions tab -> "Build Malayalam TV APK" -> download artifact "MalayalamTV-apk".
name: Build Malayalam TV APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write app source files
        shell: bash
        run: |
          mkdir -p "$(dirname "settings.gradle.kts")"
          cat > 'settings.gradle.kts' <<'__EOF_FILE__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MalayalamTV"
          include(":app")
          __EOF_FILE__
          mkdir -p "$(dirname "build.gradle.kts")"
          cat > 'build.gradle.kts' <<'__EOF_FILE__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __EOF_FILE__
          mkdir -p "$(dirname "gradle.properties")"
          cat > 'gradle.properties' <<'__EOF_FILE__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          __EOF_FILE__
          mkdir -p "$(dirname "gradle/wrapper/gradle-wrapper.properties")"
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'__EOF_FILE__'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          __EOF_FILE__
          mkdir -p "$(dirname "app/build.gradle.kts")"
          cat > 'app/build.gradle.kts' <<'__EOF_FILE__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ivl.malayalamtv"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ivl.malayalamtv"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  vectorDrawables.useSupportLibrary = true
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // Signed with the debug key so the release APK installs directly.
                      // Replace with your own keystore before publishing to Play Store.
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  viewBinding = false
              }
          }

          dependencies {
              val media3 = "1.4.1"
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-exoplayer-dash:$media3")
              implementation("androidx.media3:media3-ui:$media3")
          }
          __EOF_FILE__
          mkdir -p "$(dirname "app/proguard-rules.pro")"
          cat > 'app/proguard-rules.pro' <<'__EOF_FILE__'
          # no rules needed (minify disabled)
          __EOF_FILE__
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > 'app/src/main/AndroidManifest.xml' <<'__EOF_FILE__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <!-- Runs on phones, tablets and Android TV boxes -->
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:banner="@drawable/tv_banner"
                  android:icon="@drawable/ic_launcher_legacy"
                  android:roundIcon="@drawable/ic_launcher_legacy"
                  android:label="@string/app_name"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MalayalamTV">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".PlayerActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:theme="@style/Theme.MalayalamTV.Player" />
              </application>
          </manifest>
          __EOF_FILE__
          mkdir -p "$(dirname "app/src/main/java/com/ivl/malayalamtv/Channel.kt")"
          cat > 'app/src/main/java/com/ivl/malayalamtv/Channel.kt' <<'__EOF_FILE__'
          package com.ivl.malayalamtv

          /** One entry of the M3U playlist. */
          data class Channel(
              val name: String,
              val url: String,
              val logo: String = "",
              val group: String = "",
              val tvgId: String = "",
              val userAgent: String? = null,
              val referrer: String? = null
          )
          __EOF_FILE__
          mkdir -p "$(dirname "app/src/main/java/com/ivl/malayalamtv/ChannelAdapter.kt")"
          cat > 'app/src/main/java/com/ivl/malayalamtv/ChannelAdapter.kt' <<'__EOF_FILE__'
          package com.ivl.malayalamtv

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class ChannelAdapter(
              private val onClick: (Int) -> Unit,
              private val onLongClick: (Int) -> Unit
          ) : RecyclerView.Adapter<ChannelAdapter.VH>() {

              var items: List<Channel> = emptyList()
                  set(value) { field = value; notifyDataSetChanged() }
              var favourites: Set<String> = emptySet()

              class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val logo: ImageView = v.findViewById(R.id.logo)
                  val name: TextView = v.findViewById(R.id.name)
                  val group: TextView = v.findViewById(R.id.group)
                  val fav: TextView = v.findViewById(R.id.fav)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =
                  VH(LayoutInflater.from(parent.context).inflate(R.layout.item_channel, parent, false))

              override fun getItemCount() = items.size

              override fun onBindViewHolder(h: VH, position: Int) {
                  val c = items[position]
                  h.name.text = c.name
                  h.group.text = c.group
                  h.fav.visibility = if (favourites.contains(c.url)) View.VISIBLE else View.GONE
                  ImageLoader.load(c.logo, h.logo, R.drawable.logo_placeholder)
                  h.itemView.setOnClickListener { onClick(h.bindingAdapterPosition) }
                  h.itemView.setOnLongClickListener { onLongClick(h.bindingAdapterPosition); true }
              }
          }
          __EOF_FILE__
          mkdir -p "$(dirname "app/src/main/java/com/ivl/malayalamtv/ChannelStore.kt")"
          cat > 'app/src/main/java/com/ivl/malayalamtv/ChannelStore.kt' <<'__EOF_FILE__'
          package com.ivl.malayalamtv

          /** In-memory list shared between the channel grid and the player (channel up/down). */
          object ChannelStore {
              var channels: List<Channel> = emptyList()
          }
          __EOF_FILE__
          mkdir -p "$(dirname "app/src/main/java/com/ivl/malayalamtv/ImageLoader.kt")"
          cat > 'app/src/main/java/com/ivl/malayalamtv/ImageLoader.kt' <<'__EOF_FILE__'
          package com.ivl.malayalamtv

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Handler
          import android.os.Looper
          import android.util.LruCache
          import android.widget.ImageView
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors

          /** Tiny logo loader (no extra library): memory cache + 4 download threads. */
          object ImageLoader {
              private val cache = object : LruCache<String, Bitmap>(16 * 1024 * 1024) {
                  override fun sizeOf(key: String, value: Bitmap) = value.byteCount
              }
              private val failed = HashSet<String>()
              private val pool = Executors.newFixedThreadPool(4)
              private val main = Handler(Looper.getMainLooper())

              fun load(url: String, into: ImageView, placeholder: Int) {
                  into.tag = url
                  if (url.isBlank() || failed.contains(url)) { into.setImageResource(placeholder); return }
                  cache.get(url)?.let { into.setImageBitmap(it); return }
                  into.setImageResource(placeholder)
                  pool.execute {
                      val bmp = try { fetch(url) } catch (e: Exception) { null }
                      if (bmp == null) synchronized(failed) { failed.add(url) } else cache.put(url, bmp)
                      main.post { if (into.tag == url && bmp != null) into.setImageBitmap(bmp) }
                  }
              }

              private fun fetch(url: String): Bitmap? {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 10000; c.readTimeout = 10000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "MalayalamTV/1.0 (Android)")
                  if (c.responseCode != 200) return null
                  val bytes = c.inputStream.use { it.readBytes() }
                  // downscale large logos
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o)
                  var sample = 1
                  while (o.outWidth / sample > 400 || o.outHeight / sample > 400) sample *= 2
                  return BitmapFactory.decodeByteArray(bytes, 0, bytes.size, BitmapFactory.Options().apply { inSampleSize = sample })
              }
          }
          __EOF_FILE__
          mkdir -p "$(dirname "app/src/main/java/com/ivl/malayalamtv/M3uParser.kt")"
          cat > 'app/src/main/java/com/ivl/malayalamtv/M3uParser.kt' <<'__EOF_FILE__'
          package com.ivl.malayalamtv

          /**
           * Parses an extended M3U playlist (iptv-org format):
           *
           * #EXTM3U
           * #EXTINF:-1 tvg-id="AsianetNews.in" tvg-logo="https://..." group-title="News",Asianet News (720p)
           * #EXTVLCOPT:http-user-agent=Mozilla/5.0 ...
           * #EXTVLCOPT:http-referrer=https://...
           * https://.../index.m3u8
           */
          object M3uParser {

              private val attr = Regex("""([\w-]+)="([^"]*)"""")

              fun parse(text: String): List<Channel> {
                  val out = ArrayList<Channel>()
                  var name = ""
                  var attrs: Map<String, String> = emptyMap()
                  var ua: String? = null
                  var ref: String? = null
                  var pending = false

                  text.lineSequence().map { it.trim() }.forEach { line ->
                      when {
                          line.isEmpty() || line.startsWith("#EXTM3U") -> Unit
                          line.startsWith("#EXTINF", ignoreCase = true) -> {
                              val comma = line.lastIndexOf(',')
                              name = if (comma >= 0) line.substring(comma + 1).trim() else ""
                              val head = if (comma >= 0) line.substring(0, comma) else line
                              attrs = attr.findAll(head).associate { it.groupValues[1].lowercase() to it.groupValues[2] }
                              ua = attrs["http-user-agent"] ?: attrs["user-agent"]
                              ref = attrs["http-referrer"] ?: attrs["referrer"]
                              pending = true
                          }
                          line.startsWith("#EXTVLCOPT", ignoreCase = true) -> {
                              val opt = line.substringAfter(':')
                              when {
                                  opt.startsWith("http-user-agent=", true) -> ua = opt.substringAfter('=')
                                  opt.startsWith("http-referrer=", true) -> ref = opt.substringAfter('=')
                              }
                          }
                          line.startsWith("#") -> Unit
                          else -> {
                              // stream URL
                              if (pending || line.startsWith("http", true) || line.startsWith("rtmp", true)) {
                                  out += Channel(
                                      name = name.ifBlank { line.substringAfterLast('/') },
                                      url = line,
                                      logo = attrs["tvg-logo"].orEmpty(),
                                      group = attrs["group-title"].orEmpty()
                                          .split(';').firstOrNull().orEmpty().ifBlank { "Other" },
                                      tvgId = attrs["tvg-id"].orEmpty(),
                                      userAgent = ua,
                                      referrer = ref
                                  )
                              }
                              name = ""; attrs = emptyMap(); ua = null; ref = null; pending = false
                          }
                      }
                  }
                  // drop duplicate URLs, sort by name
                  return out.distinctBy { it.url }.sortedBy { it.name.lowercase() }
              }
          }
          __EOF_FILE__
          mkdir -p "$(dirname "app/src/main/java/com/ivl/malayalamtv/MainActivity.kt")"
          cat > 'app/src/main/java/com/ivl/malayalamtv/MainActivity.kt' <<'__EOF_FILE__'
          package com.ivl.malayalamtv

          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.ImageButton
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout
          import java.util.concurrent.Executors

          /** Channel grid: search, category filter, favourites, refresh, custom playlist URL. */
          class MainActivity : AppCompatActivity() {

              private lateinit var repo: PlaylistRepository
              private lateinit var adapter: ChannelAdapter
              private lateinit var status: TextView
              private lateinit var swipe: SwipeRefreshLayout
              private lateinit var search: EditText
              private lateinit var groupSpinner: Spinner

              private var all: List<Channel> = emptyList()
              private var groups: List<String> = emptyList()
              private val io = Executors.newSingleThreadExecutor()
              private val main = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  repo = PlaylistRepository(this)

                  status = findViewById(R.id.status)
                  swipe = findViewById(R.id.swipe)
                  search = findViewById(R.id.search)
                  groupSpinner = findViewById(R.id.groupSpinner)

                  adapter = ChannelAdapter(::openChannel, ::toggleFavourite)
                  val list = findViewById<RecyclerView>(R.id.list)
                  val widthDp = resources.displayMetrics.widthPixels / resources.displayMetrics.density
                  list.layoutManager = GridLayoutManager(this, maxOf(2, (widthDp / 170).toInt()))
                  list.adapter = adapter

                  swipe.setOnRefreshListener { load(force = true) }
                  findViewById<ImageButton>(R.id.btnRefresh).setOnClickListener { load(force = true) }
                  findViewById<ImageButton>(R.id.btnSettings).setOnClickListener { editPlaylistUrl() }

                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) = Unit
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) = Unit
                      override fun afterTextChanged(s: Editable?) = applyFilter()
                  })
                  groupSpinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) = applyFilter()
                      override fun onNothingSelected(p: AdapterView<*>?) = Unit
                  }

                  // show the saved list immediately, then refresh from the internet
                  val cached = repo.cached()
                  if (cached.isNotEmpty()) setChannels(cached)
                  load(force = false)
              }

              private fun load(force: Boolean) {
                  swipe.isRefreshing = true
                  if (all.isEmpty()) status.setText(R.string.loading)
                  io.execute {
                      val result = runCatching { repo.download() }
                      main.post {
                          swipe.isRefreshing = false
                          result.onSuccess { setChannels(it) }
                              .onFailure {
                                  if (force || all.isEmpty())
                                      Toast.makeText(this, getString(R.string.load_failed) + "\n" + it.message, Toast.LENGTH_LONG).show()
                                  if (all.isEmpty()) status.setText(R.string.no_channels)
                              }
                      }
                  }
              }

              private fun setChannels(list: List<Channel>) {
                  all = list
                  groups = list.map { it.group }.distinct().sorted()
                  val labels = listOf(getString(R.string.all_groups), getString(R.string.favourites)) + groups
                  val sel = groupSpinner.selectedItemPosition
                  groupSpinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, labels)
                  if (sel in labels.indices) groupSpinner.setSelection(sel)
                  applyFilter()
              }

              private fun applyFilter() {
                  val q = search.text.toString().trim().lowercase()
                  val pos = groupSpinner.selectedItemPosition
                  val favs = repo.favourites()
                  val filtered = all.filter { c ->
                      (q.isEmpty() || c.name.lowercase().contains(q) || c.group.lowercase().contains(q)) &&
                          when {
                              pos <= 0 -> true
                              pos == 1 -> favs.contains(c.url)
                              else -> c.group == groups.getOrNull(pos - 2)
                          }
                  }
                  adapter.favourites = favs
                  adapter.items = filtered
                  ChannelStore.channels = filtered
                  status.text = if (filtered.isEmpty()) getString(R.string.no_channels)
                  else "${filtered.size} channels · ${repo.playlistUrl.substringAfterLast('/')} · long-press = favourite"
              }

              private fun openChannel(index: Int) {
                  if (index !in ChannelStore.channels.indices) return
                  repo.lastChannelUrl = ChannelStore.channels[index].url
                  startActivity(Intent(this, PlayerActivity::class.java).putExtra(PlayerActivity.EXTRA_INDEX, index))
              }

              private fun toggleFavourite(index: Int) {
                  val c = ChannelStore.channels.getOrNull(index) ?: return
                  val added = repo.toggleFavourite(c.url)
                  Toast.makeText(this, (if (added) "★ Added: " else "Removed: ") + c.name, Toast.LENGTH_SHORT).show()
                  adapter.favourites = repo.favourites()
                  adapter.notifyItemChanged(index)
              }

              private fun editPlaylistUrl() {
                  val input = EditText(this).apply { setText(repo.playlistUrl); setSingleLine() }
                  AlertDialog.Builder(this)
                      .setTitle(R.string.playlist_url)
                      .setMessage(R.string.playlist_url_msg)
                      .setView(input)
                      .setPositiveButton(R.string.save) { _, _ ->
                          val url = input.text.toString().trim()
                          if (url.startsWith("http")) { repo.playlistUrl = url; load(force = true) }
                      }
                      .setNeutralButton(R.string.reset) { _, _ -> repo.resetUrl(); load(force = true) }
                      .setNegativeButton(R.string.cancel, null)
                      .show()
              }
          }
          __EOF_FILE__
          mkdir -p "$(dirname "app/src/main/java/com/ivl/malayalamtv/PlayerActivity.kt")"
          cat > 'app/src/main/java/com/ivl/malayalamtv/PlayerActivity.kt' <<'__EOF_FILE__'
          package com.ivl.malayalamtv

          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.annotation.OptIn
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.ui.PlayerView

          /**
           * Full-screen player (HLS / DASH / progressive).
           * Phone: swipe the error panel buttons or use the on-screen controls.
           * TV remote: D-pad UP / DOWN or CHANNEL +/- = previous / next channel, OK = show controls.
           */
          @OptIn(UnstableApi::class)
          class PlayerActivity : AppCompatActivity() {

              private var player: ExoPlayer? = null
              private lateinit var playerView: PlayerView
              private lateinit var banner: View
              private lateinit var bannerName: TextView
              private lateinit var bannerLogo: ImageView
              private lateinit var errorPanel: View
              private lateinit var errorText: TextView
              private var index = 0
              private val handler = Handler(Looper.getMainLooper())
              private val hideBanner = Runnable { banner.visibility = View.GONE }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_player)
                  playerView = findViewById(R.id.playerView)
                  banner = findViewById(R.id.banner)
                  bannerName = findViewById(R.id.bannerName)
                  bannerLogo = findViewById(R.id.bannerLogo)
                  errorPanel = findViewById(R.id.errorPanel)
                  errorText = findViewById(R.id.errorText)
                  findViewById<Button>(R.id.btnRetry).setOnClickListener { play(index) }
                  findViewById<Button>(R.id.btnNext).setOnClickListener { play(index + 1) }

                  index = savedInstanceState?.getInt(EXTRA_INDEX) ?: intent.getIntExtra(EXTRA_INDEX, 0)
                  hideSystemBars()
              }

              override fun onStart() {
                  super.onStart()
                  if (ChannelStore.channels.isEmpty()) { finish(); return }
                  play(index)
              }

              override fun onStop() {
                  super.onStop()
                  releasePlayer()
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  outState.putInt(EXTRA_INDEX, index)
              }

              private fun play(i: Int) {
                  val list = ChannelStore.channels
                  if (list.isEmpty()) return
                  index = ((i % list.size) + list.size) % list.size
                  val ch = list[index]
                  errorPanel.visibility = View.GONE
                  showBanner(ch)
                  releasePlayer()

                  // per-channel User-Agent / Referer from #EXTVLCOPT lines
                  val http = DefaultHttpDataSource.Factory()
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15000)
                      .setReadTimeoutMs(15000)
                      .setUserAgent(ch.userAgent ?: "Mozilla/5.0 (Linux; Android) MalayalamTV/1.0")
                  ch.referrer?.let { http.setDefaultRequestProperties(mapOf("Referer" to it)) }

                  val item = MediaItem.Builder().setUri(ch.url).apply {
                      val u = ch.url.lowercase()
                      when {
                          u.contains(".m3u8") -> setMimeType(MimeTypes.APPLICATION_M3U8)
                          u.contains(".mpd") -> setMimeType(MimeTypes.APPLICATION_MPD)
                      }
                  }.build()

                  player = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(http))
                      .build().also { p ->
                          playerView.player = p
                          p.addListener(object : Player.Listener {
                              override fun onPlayerError(error: PlaybackException) {
                                  errorText.text = getString(R.string.stream_error) + "\n\n" + ch.name + "\n(" + error.errorCodeName + ")"
                                  errorPanel.visibility = View.VISIBLE
                                  findViewById<Button>(R.id.btnNext).requestFocus()
                              }
                          })
                          p.setMediaItem(item)
                          p.playWhenReady = true
                          p.prepare()
                      }
              }

              private fun showBanner(ch: Channel) {
                  bannerName.text = "${index + 1}. ${ch.name}"
                  ImageLoader.load(ch.logo, bannerLogo, R.drawable.logo_placeholder)
                  banner.visibility = View.VISIBLE
                  handler.removeCallbacks(hideBanner)
                  handler.postDelayed(hideBanner, 4000)
              }

              private fun releasePlayer() {
                  player?.release()
                  player = null
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  val controlsVisible = playerView.isControllerFullyVisible
                  return when (keyCode) {
                      KeyEvent.KEYCODE_CHANNEL_UP -> { play(index - 1); true }
                      KeyEvent.KEYCODE_CHANNEL_DOWN -> { play(index + 1); true }
                      KeyEvent.KEYCODE_DPAD_UP -> if (!controlsVisible && errorPanel.visibility != View.VISIBLE) { play(index - 1); true } else super.onKeyDown(keyCode, event)
                      KeyEvent.KEYCODE_DPAD_DOWN -> if (!controlsVisible && errorPanel.visibility != View.VISIBLE) { play(index + 1); true } else super.onKeyDown(keyCode, event)
                      KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER ->
                          if (!controlsVisible && errorPanel.visibility != View.VISIBLE) { playerView.showController(); true } else super.onKeyDown(keyCode, event)
                      else -> super.onKeyDown(keyCode, event)
                  }
              }

              @Suppress("DEPRECATION")
              private fun hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let {
                          it.hide(WindowInsets.Type.systemBars())
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)
                  }
              }

              companion object {
                  const val EXTRA_INDEX = "index"
              }
          }
