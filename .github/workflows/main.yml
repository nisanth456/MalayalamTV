      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already contains the Android SDK ($ANDROID_HOME) - no extra action needed
      - name: Prepare Android SDK + Gradle 8.7
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MalayalamTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk
