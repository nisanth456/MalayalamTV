          mkdir -p "$(dirname "app/src/main/java/com/ivl/malayalamtv/PlaylistRepository.kt")"
          cat > 'app/src/main/java/com/ivl/malayalamtv/PlaylistRepository.kt' <<'__EOF_FILE__'
          package com.ivl.malayalamtv

          import android.content.Context
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          /** Downloads the playlist and keeps a copy on the device for offline start-up. */
          class PlaylistRepository(private val context: Context) {

              private val prefs = context.getSharedPreferences("settings", Context.MODE_PRIVATE)
              private val cacheFile = File(context.filesDir, "playlist.m3u")

              var playlistUrl: String
                  get() = prefs.getString("playlist_url", null) ?: context.getString(R.string.default_playlist)
                  set(value) = prefs.edit().putString("playlist_url", value).apply()

              fun resetUrl() = prefs.edit().remove("playlist_url").apply()

              /** Saved copy (may be empty on first launch). */
              fun cached(): List<Channel> =
                  if (cacheFile.exists()) M3uParser.parse(cacheFile.readText()) else emptyList()

              /** Network load - call from a background thread. Throws on failure. */
              fun download(): List<Channel> {
                  val text = httpGet(playlistUrl)
                  val list = M3uParser.parse(text)
                  if (list.isNotEmpty()) cacheFile.writeText(text)
                  return list
              }

              // ---------------------------------------------------------- favourites
              fun favourites(): MutableSet<String> =
                  prefs.getStringSet("favs", emptySet())!!.toMutableSet()

              fun toggleFavourite(url: String): Boolean {
                  val f = favourites()
                  val added = if (f.contains(url)) { f.remove(url); false } else { f.add(url); true }
                  prefs.edit().putStringSet("favs", f).apply()
                  return added
              }

              var lastChannelUrl: String?
                  get() = prefs.getString("last_channel", null)
                  set(v) = prefs.edit().putString("last_channel", v).apply()

              companion object {
                  fun httpGet(url: String, timeoutMs: Int = 20000): String {
                      var current = url
                      repeat(5) { // follow redirects (incl. http <-> https)
                          val c = URL(current).openConnection() as HttpURLConnection
                          c.connectTimeout = timeoutMs
                          c.readTimeout = timeoutMs
                          c.instanceFollowRedirects = true
                          c.setRequestProperty("User-Agent", "MalayalamTV/1.0 (Android)")
                          val code = c.responseCode
                          if (code in 300..399) {
                              current = c.getHeaderField("Location") ?: throw IllegalStateException("Redirect without location")
                              c.disconnect()
                              return@repeat
                          }
                          if (code != 200) throw IllegalStateException("HTTP $code")
                          return c.inputStream.bufferedReader().use { it.readText() }
                      }
                      throw IllegalStateException("Too many redirects")
                  }
              }
          }
